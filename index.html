<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1e2329">
  <title>Hallenfest 3D-Plan</title>
  <style>
    :root { --ui: rgba(24, 28, 33, 0.82); --ui-line: rgba(255, 255, 255, 0.14); --accent: #f2b705; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #c9d6e2; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    #app { position: fixed; inset: 0; touch-action: none; }
    #app canvas { display: block; }
    .labels { position: absolute; inset: 0; }
    .lbl { padding: 3px 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.92); color: #1d2125; font-size: 12px; font-weight: 600; white-space: nowrap; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25); border-left: 4px solid #6b7280; pointer-events: none; }
    .lbl.main { border-left-color: #2f9e44; }
    .lbl.zone { border-left-color: #d6336c; font-size: 13px; }
    .lbl.exit { border-left-color: #c2255c; background: #fff0f6; }
    .lbl.room { border-left-color: #1c7ed6; font-weight: 500; }
    .lbl.minor { font-size: 10px; font-weight: 500; padding: 2px 6px; opacity: 0.9; }
    header { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; gap: 8px; align-items: center; pointer-events: none; }
    header h1 { margin: 0; padding: 8px 12px; font-size: 15px; color: #fff; background: var(--ui); border-radius: 10px; backdrop-filter: blur(6px); pointer-events: auto; }
    header .spacer { flex: 1; }
    .tools { display: flex; gap: 6px; pointer-events: auto; }
    button, .tools a { font: inherit; font-size: 13px; color: #fff; background: var(--ui); border: 1px solid var(--ui-line); border-radius: 10px; padding: 8px 11px; cursor: pointer; text-decoration: none; backdrop-filter: blur(6px); white-space: nowrap; }
    button.on { border-color: var(--accent); color: var(--accent); }
    #views { position: fixed; left: 0; right: 0; bottom: max(10px, env(safe-area-inset-bottom)); display: flex; gap: 6px; padding: 0 12px; overflow-x: auto; scrollbar-width: none; justify-content: safe center; }
    #views::-webkit-scrollbar { display: none; }
    #views button { flex: 0 0 auto; }
    #views button.active { background: var(--accent); color: #1d2125; border-color: var(--accent); font-weight: 600; }
    #hint { position: fixed; left: 50%; bottom: calc(max(10px, env(safe-area-inset-bottom)) + 52px); transform: translateX(-50%); color: #fff; background: rgba(0, 0, 0, 0.55); padding: 6px 12px; border-radius: 8px; font-size: 12px; transition: opacity 0.6s; pointer-events: none; white-space: nowrap; }
    #hint.hide { opacity: 0; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #1e2329; color: #fff; font-size: 15px; transition: opacity 0.5s; z-index: 10; padding: 16px; text-align: center; }
    #loading.hide { opacity: 0; pointer-events: none; }
    body.render header, body.render #views, body.render #hint { display: none; }
    @media (max-width: 640px) {
      header { flex-wrap: wrap; }
      header h1 { font-size: 14px; }
      header .spacer { display: none; }
      .tools { width: 100%; }
      .tools > * { flex: 1; padding: 7px 6px; font-size: 12px; text-align: center; }
      #views { justify-content: flex-start; }
      .lbl { font-size: 11px; }
    }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="app"></div>
  <header>
    <h1>Hallenfest – 3D-Plan</h1>
    <div class="spacer"></div>
    <div class="tools">
      <button id="btn-labels" class="on">Beschriftung</button>
      <button id="btn-zones">Zonen</button>
      <button id="btn-quality">Qualität</button>
      <a href="hallenplan-3d.pdf" target="_blank" rel="noopener">PDF</a>
    </div>
  </header>
  <nav id="views"></nav>
  <div id="hint">1 Finger drehen · 2 Finger zoomen &amp; verschieben</div>
  <div id="loading">3D-Modell wird aufgebaut …</div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
